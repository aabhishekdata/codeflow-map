<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- No data leaves this page: fetch/XHR, forms and frames are blocked. Scripts are inline (or, with --cdn, the pinned Pele file). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
<title>Code Flow Map</title>
<style>
:root{
  --font:"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F2F4F7; --ink:#1F2328; --ink-2:#4B5563; --ink-3:#6B7280;
  --line:#E3E6EB; --line-2:#D0D5DD; --accent:#2F6FB3; --accent-ink:#FFFFFF; --accent-soft:#EAF2FB; --accent-text:#174A80;
  --focus:#F59E0B; --sens:#C2410C; --sens-bg:#FFF1E8; --ok:#1E7B4F; --ok-bg:#E7F6EE; --inf:#8A6100; --inf-bg:#FFF6DA;
  --changed:#D97706; --cycle:#C2410C; --dot:#DADFE6; --shadow:0 8px 28px rgba(16,24,40,.12), 0 2px 6px rgba(16,24,40,.06);
  --heat1:#FFF4D6; --heat2:#FFE2A8; --heat3:#FFC078; --heat4:#FF8F6B;
  --group-bg:rgba(47,111,179,.05); --caption:#111827; --caption-ink:#FFFFFF;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#171B21; --surface-2:#1F242C; --ink:#E6E9EE; --ink-2:#B4BCC8; --ink-3:#8B95A5;
  --line:#2A3039; --line-2:#3A424E; --accent:#5B9BE0; --accent-ink:#0B1220; --accent-soft:#1B2A3D; --accent-text:#9CC5F2;
  --focus:#FBBF24; --sens:#F97350; --sens-bg:#3A1F17; --ok:#5FD39A; --ok-bg:#16301F; --inf:#E8C35A; --inf-bg:#3A3014;
  --changed:#F59E0B; --cycle:#F97350; --dot:#262C35; --shadow:0 10px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  --heat1:#4A3B1A; --heat2:#6A4A16; --heat3:#8A4A12; --heat4:#A3301F;
  --group-bg:rgba(91,155,224,.07); --caption:#E6E9EE; --caption-ink:#0F1216;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1216; --surface:#171B21; --surface-2:#1F242C; --ink:#E6E9EE; --ink-2:#B4BCC8; --ink-3:#8B95A5;
    --line:#2A3039; --line-2:#3A424E; --accent:#5B9BE0; --accent-ink:#0B1220; --accent-soft:#1B2A3D; --accent-text:#9CC5F2;
    --focus:#FBBF24; --sens:#F97350; --sens-bg:#3A1F17; --ok:#5FD39A; --ok-bg:#16301F; --inf:#E8C35A; --inf-bg:#3A3014;
    --changed:#F59E0B; --cycle:#F97350; --dot:#262C35; --shadow:0 10px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    --heat1:#4A3B1A; --heat2:#6A4A16; --heat3:#8A4A12; --heat4:#A3301F;
    --group-bg:rgba(91,155,224,.07); --caption:#E6E9EE; --caption-ink:#0F1216;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{min-width:0;flex:1 1 240px}
.brand h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 11px;line-height:1.2;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{position:relative}
.search input{width:190px;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px 6px 28px;background:var(--surface)}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);opacity:.55}
.results{position:absolute;top:calc(100% + 4px);right:0;width:320px;max-height:360px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none;z-index:40}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-bottom:1px solid var(--line)}
.results button:hover,.results button.sel{background:var(--accent-soft)}
.results small{display:block;color:var(--ink-3)}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none;min-width:240px;z-index:40;padding:4px}
.menu-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.menu-list button:hover{background:var(--surface-2)}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu.open .menu-list{display:block}

.subbar{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--ink-2);font-weight:550}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-text)}
.crumbs{font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs button{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:2px}
.summary{font-size:13.5px;color:var(--ink-2);flex:1 1 320px;min-width:0}
.chipx{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);margin-right:6px;vertical-align:1px}
.chipx.draft{background:var(--inf-bg);color:var(--inf);border-color:transparent}

.facets{display:none;align-items:center;gap:6px;padding:6px 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.facets.on{display:flex}
.facets .mod{font-weight:650;margin-right:6px;display:inline-flex;align-items:center;gap:6px}
.facets .ftab{border:1px solid transparent;background:none;border-radius:999px;padding:5px 12px;color:var(--ink-2)}
.facets .ftab:hover{background:var(--surface-2)}
.facets .ftab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.facets select{border:1px solid var(--line-2);border-radius:8px;padding:4px 6px;background:var(--surface);max-width:260px}
.facets .count{font-size:11px;color:var(--ink-3);margin-left:2px}

.stage{position:relative;flex:1;min-height:0;overflow:hidden;
  background-image:radial-gradient(circle, var(--dot) 1px, transparent 1px);background-size:22px 22px}
.diagram{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:28px 28px 64px;
  --pele-font:var(--font); --pele-font-mono:var(--mono); --pele-bg:var(--surface); --pele-fg:var(--ink); --pele-muted:var(--ink-3);
  --pele-line:var(--ink-3); --pele-surface:var(--surface); --pele-surface-alt:var(--group-bg); --pele-border:var(--line-2);
  --pele-accent:var(--accent); --pele-radius:8px; --pele-error:var(--sens);
  --pele-zoom-top:auto; --pele-zoom-right:auto; --pele-zoom-bottom:16px; --pele-zoom-left:16px}
.diagram > svg{max-height:100%;flex:none}
.diagram .pele-zoom{box-shadow:var(--shadow);z-index:12}
.diagram .pele-zoom button{width:30px!important;height:30px!important}

.legend{position:absolute;left:62px;bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:10;font-size:12.5px;max-width:min(620px, calc(100% - 100px))}
.legend summary{padding:8px 12px;cursor:pointer;font-weight:600;color:var(--ink-2);list-style:none}
.legend summary::-webkit-details-marker{display:none}
.legend .items{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 12px 10px;max-height:30vh;overflow:auto}
.legend .it{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw{width:16px;height:12px;border:1.5px solid;border-radius:3px;display:inline-block}
.ln{width:22px;height:0;border-top:2px solid;display:inline-block}

.panel{position:absolute;top:12px;right:12px;bottom:12px;width:min(390px, calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:20;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .25s ease;visibility:hidden}
.panel.open{transform:none;visibility:visible}
.panel header{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.panel h2{font-size:17px;margin:0;line-height:1.3;word-break:break-word}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);margin-top:6px;margin-right:4px}
.panel .x{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;color:var(--ink-3);padding:2px 6px;border-radius:6px}
.panel .x:hover{background:var(--surface-2)}
.panel .body{padding:12px 16px 18px;overflow:auto;flex:1}
.panel h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:16px 0 6px}
.panel h3:first-child{margin-top:4px}
.panel p{margin:0 0 6px;line-height:1.55}
.panel ul{margin:0;padding-left:18px;line-height:1.55}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--surface-2);border-radius:6px;padding:2px 8px;font-size:12.5px;word-break:break-word}
.tag.sens{background:var(--sens-bg);color:var(--sens)}
.mtab{width:100%;border-collapse:collapse;font-size:13px}
.mtab td{border-bottom:1px solid var(--line);padding:5px 2px;vertical-align:top}
.mtab td:first-child{color:var(--ink-3);width:58%}
.links button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;margin-bottom:6px}
.links button:hover{background:var(--surface-2)}
.links small{color:var(--ink-3)}
.tech{margin-top:14px;border:1px solid var(--line);border-radius:10px}
.tech summary{padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
.tech .in{padding:0 12px 10px}
code,.mono{font-family:var(--mono);font-size:12px}
.tech code{background:var(--surface-2);padding:1px 5px;border-radius:4px;word-break:break-all;white-space:pre-wrap}
.files a,.files span{display:block;font-family:var(--mono);font-size:12px;padding:2px 0;word-break:break-all;color:var(--accent)}
.files span{color:var(--ink-2)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.actions .btn{justify-content:center}
.badge-inf{color:var(--inf);background:var(--inf-bg);border-color:transparent}
.badge-ver{color:var(--ok);background:var(--ok-bg);border-color:transparent}

.caption{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(720px, calc(100% - 40px));background:var(--caption);color:var(--caption-ink);border-radius:14px;box-shadow:var(--shadow);z-index:25;display:none;padding:14px 16px}
.caption.open{display:block}
.caption .row{display:flex;align-items:center;gap:10px}
.caption .count{font-size:12px;opacity:.7;white-space:nowrap}
.caption .text{font-size:15.5px;line-height:1.5;margin:6px 0 10px}
.caption .btn{background:transparent;border-color:color-mix(in srgb, var(--caption-ink) 30%, transparent);color:var(--caption-ink)}
.caption .btn.primary{background:var(--caption-ink);color:var(--caption);border-color:var(--caption-ink)}
.caption .bar{height:3px;background:color-mix(in srgb, var(--caption-ink) 25%, transparent);border-radius:3px;overflow:hidden;flex:1}
.caption .bar i{display:block;height:100%;background:var(--focus);width:0;transition:width .3s}
.stage.walking .legend{display:none}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(17,24,39,.82);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;z-index:9;pointer-events:none;transition:opacity .6s;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.error{max-width:760px;margin:40px auto;background:var(--surface);border:1px solid var(--sens);border-radius:12px;padding:18px 20px;position:relative;z-index:5}
.error pre{white-space:pre-wrap;background:var(--surface-2);padding:10px;border-radius:8px;font-size:12px;max-height:300px;overflow:auto}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--caption);color:var(--caption-ink);padding:8px 14px;border-radius:8px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
dialog{border:0;border-radius:14px;box-shadow:var(--shadow);padding:0;width:min(680px, calc(100% - 32px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(17,24,39,.4)}
dialog .dh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
dialog .dh h2{margin:0;font-size:17px}
dialog .db{padding:6px 20px 20px;max-height:70vh;overflow:auto;line-height:1.55}
dialog .db h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:18px 0 6px}
dialog table{border-collapse:collapse;width:100%;font-size:13px}
dialog td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
dialog td:first-child{color:var(--ink-3);width:34%}

/* ---------------- diagram styling (Pele SVG) ---------------- */
.diagram svg .pele-node,.diagram svg .pele-edge,.diagram svg .pele-edge-label,.diagram svg .pele-cluster-label,.diagram svg .pele-note{cursor:pointer}
.diagram svg .pele-node,.diagram svg .pele-edge,.diagram svg .pele-edge-label,.diagram svg .pele-cluster{transition:opacity .2s}
.diagram svg .pele-edge path:not(.pele-marker){stroke-width:1.6px}
.diagram svg .pele-edge-label rect{fill:var(--surface)}
.diagram svg .pele-cluster > rect{fill:var(--group-bg);stroke:var(--line-2)}
.diagram svg .pele-node.inferred > :is(rect,path,polygon,circle,ellipse){stroke-dasharray:6 4}
.diagram svg .pele-node.impact > :is(rect,path,polygon,circle,ellipse){stroke-dasharray:4 3}
.diagram svg .pele-node.changed > :is(rect,path,polygon,circle,ellipse){stroke:var(--changed)!important;stroke-width:3px}
.diagram svg .pele-node.ext > :is(rect,path){fill:var(--surface-2)!important;stroke-dasharray:4 3}
.diagram svg .pele-edge.sens path:not(.pele-marker){stroke:var(--sens);stroke-width:2.6px}
.diagram svg .pele-edge.sens .pele-marker{stroke:var(--sens)}
.diagram svg .pele-edge.sens .pele-marker:not([fill="none"]):not([fill="var(--_bg)"]){fill:var(--sens)}
.diagram svg .pele-edge.cycle path:not(.pele-marker){stroke:var(--cycle);stroke-dasharray:7 4}
.diagram svg .pele-edge.cycle .pele-marker:not([fill="none"]){fill:var(--cycle)}
.diagram svg .badge{pointer-events:none}
.diagram svg .badge circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.diagram svg .badge text{fill:var(--accent-ink);font-size:12px;font-weight:700}
.diagram svg.heat-on .pele-node.heat1 > :is(rect,path,polygon,circle,ellipse):not([fill="none"]){fill:var(--heat1)!important}
.diagram svg.heat-on .pele-node.heat2 > :is(rect,path,polygon,circle,ellipse):not([fill="none"]){fill:var(--heat2)!important}
.diagram svg.heat-on .pele-node.heat3 > :is(rect,path,polygon,circle,ellipse):not([fill="none"]){fill:var(--heat3)!important}
.diagram svg.heat-on .pele-node.heat4 > :is(rect,path,polygon,circle,ellipse):not([fill="none"]){fill:var(--heat4)!important}
.diagram svg.heat-on .pele-node:not(.heat1):not(.heat2):not(.heat3):not(.heat4) > :is(rect,path,polygon,circle,ellipse):not([fill="none"]){fill:var(--surface)!important}
.diagram svg.focusing .pele-node:not(.lit),.diagram svg.focusing .pele-edge:not(.lit),.diagram svg.focusing .pele-edge-label:not(.lit),.diagram svg.focusing .pele-note:not(.lit){opacity:.16}
.diagram svg.focusing .pele-cluster:not(.lit){opacity:.6}
.diagram svg .pele-node.target > :is(rect,path,polygon,circle,ellipse){stroke:var(--focus)!important;stroke-width:3.2px!important}
.diagram svg .pele-edge.lit path:not(.pele-marker){stroke-width:2.6px}
.diagram svg .pele-edge.target path:not(.pele-marker){stroke:var(--focus)!important;stroke-width:3.4px!important}
.diagram svg .pele-edge.target .pele-marker:not([fill="none"]){fill:var(--focus)}
.diagram svg .pele-cluster.target > rect{stroke:var(--focus)!important;stroke-width:3px}
.diagram svg .pele-edge-label.target text{font-weight:700}
@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.diagram svg .pulse{animation:pulse .9s ease 2}

@media (max-width:760px){
  .top{gap:8px;padding:8px 10px}
  .brand{flex-basis:100%}
  .search input{width:120px}
  .tools .lbl{display:none}
  .subbar{padding:6px 10px;gap:8px}
  .summary{flex-basis:100%;font-size:12.5px}
  .facets{padding:6px 10px}
  .legend{left:56px;max-width:calc(100% - 68px)}
  .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:58%;transform:translateY(calc(100% + 16px))}
  .panel.open{transform:none}
  .diagram{padding:12px 12px 60px}
  .caption{bottom:10px;width:calc(100% - 16px)}
  .caption .text{font-size:14px}
  .hint{display:none}
}
#printArea{display:none}
@media print{
  body{overflow:visible;display:block;background:#fff;color:#000}
  .top .tools,.subbar .tabs,.facets,.stage,.toast,dialog{display:none!important}
  .top,.subbar{border:0;padding:0 0 6px;background:#fff}
  #printArea{display:block}
  #printArea svg{width:100%!important;height:auto!important;max-height:88vh}
}
</style>
<style id="kindStyles"></style>
<style id="themeOverrides"></style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 id="title">Code Flow Map</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="tools">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Find…  ( / )" autocomplete="off" aria-label="Search the map">
      <div class="results" id="results" role="listbox"></div>
    </div>
    <div class="seg" role="group" aria-label="Label style">
      <button id="modeSimple" aria-pressed="true" title="Plain-English labels for business audiences">Simple</button>
      <button id="modeTech" aria-pressed="false" title="Technical names: files, functions, endpoints">Technical</button>
    </div>
    <button class="btn" id="sensBtn" aria-pressed="true" title="Highlight flows that carry sensitive or personal data">🔒<span class="lbl"> Sensitive</span></button>
    <button class="btn" id="heatBtn" aria-pressed="false" title="Colour by hotspot: complex code that changes often">🔥<span class="lbl"> Hotspots</span></button>
    <button class="btn" id="themeBtn" title="Theme: follow system / light / dark">◐<span class="lbl" id="themeLbl"> Auto</span></button>
    <button class="btn primary" id="walkBtn" title="Step-by-step guided explanation (good for presenting)">▶<span class="lbl"> Walk me through</span></button>
    <div class="menu" id="menu">
      <button class="btn" id="menuBtn" aria-haspopup="true" aria-expanded="false">More ▾</button>
      <div class="menu-list" role="menu">
        <button data-act="about">ⓘ About this map</button>
        <button data-act="fullscreen">⛶ Full screen</button>
        <button data-act="print">🖨 Print / Save as PDF</button>
        <hr>
        <button data-act="svg">⬇ Download this picture (SVG)</button>
        <button data-act="mmd">⬇ Download this view as Mermaid (.mmd)</button>
        <button data-act="md">⬇ Download all views as Markdown</button>
        <button data-act="copy">⧉ Copy Mermaid code</button>

      return out.sort((a, b) => a.pri - b.pri).slice(0, 50);
    };
    const draw = () => { res.innerHTML = hits.map((h, i) => `<button class="${i === sel ? 'sel' : ''}" data-i="${i}">${esc(h.label)}<small>${esc(h.where)}</small></button>`).join('') || '<button disabled>No matches</button>'; res.style.display = 'block'; };
    const go = h => { res.style.display = 'none'; inp.blur();
      if (S.view.id !== h.vid) navigateTo(h.vid);
      if (h.group) { showGroup(h.group); camera(() => [S.maps.group[h.group]]); return; }
      showNode(h.id); camera(() => [S.maps.node[h.id]]);
      const el = S.maps.node[h.id]; el?.classList.add('pulse'); setTimeout(() => el?.classList.remove('pulse'), 2000); };
    inp.addEventListener('input', () => { hits = collect(inp.value); sel = 0; inp.value.trim() ? draw() : res.style.display = 'none'; });
    inp.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, hits.length - 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
      else if (e.key === 'Enter' && hits[sel]) go(hits[sel]);
      else if (e.key === 'Escape') { res.style.display = 'none'; inp.blur(); }
    });
    res.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) go(hits[+b.dataset.i]); });
    document.addEventListener('click', e => { if (!e.target.closest('.search')) res.style.display = 'none'; });
  }

  // ------------------------------------------------------------------ export & misc
  function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
  const slug = s => String(s || 'view').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  async function copyText(t, msg){
    try { await navigator.clipboard.writeText(t); toast(msg || 'Copied'); }
    catch { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(msg || 'Copied'); }
  }
  const portable = v => G.gen(v, genOpts({ portable: true })).code;
  function exportSvg(v){
    const css = getComputedStyle(document.body);
    const r = pele.render(portable(v), Object.assign({}, PELE_OPTS, { idPrefix: 'x' + slug(v.id), fontFamily: css.fontFamily }));
    const cv = n => css.getPropertyValue(n).trim().replace(/[^#\w\s.,%()-]/g, '');
    const vars = `--pele-bg:${cv('--surface')};--pele-fg:${cv('--ink')};--pele-line:${cv('--ink-3')};--pele-border:${cv('--line-2')};--pele-surface:${cv('--surface')};--pele-surface-alt:${cv('--surface-2')};--pele-muted:${cv('--ink-3')};`;
    return r.svg.replace('<svg ', `<svg data-theme-vars="1" `).replace(/style="/, `style="${vars}`);
  }
  function allMarkdown(){
    const d = S.data, out = [`# ${d.title || 'Code flow map'}`, ''];
    if (d.subtitle) out.push(d.subtitle, '');
    S.order.forEach(id => { const v = S.views[id]; if (v.type === 'mermaid' && !v.mermaid) return;
      const t = v.module && v.kind === 'detail' ? `${moduleInfo(v.module).label || v.module}: ${v.title}` : v.title;
      out.push(`## ${t}`, '', v.summary || '', '', '```mermaid', portable(v), '```', ''); });
    return out.join('\n');
  }
  function about(){
    const d = S.data, g = d.generated || {};
    const row = (k, v) => v ? `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>` : '';
    const nmods = Object.keys(S.modules).length, nviews = S.order.length;
    $('aboutBody').innerHTML = (d.description ? `<p>${esc(d.description)}</p>` : '')
      + '<h3>Source</h3><table>' + row('System', d.repo?.name) + row('Location', d.repo?.url || d.repo?.path) + row('Version / commit', g.commit)
      + row('Scope', g.scope) + row('Prepared on', g.date) + row('Prepared by', g.by) + row('Method', g.method || 'AI-assisted reading of the source code, supported by a static scan')
      + row('Contents', `${nviews} view${nviews === 1 ? '' : 's'}${nmods ? `, ${nmods} modules` : ''}`) + '</table>'
      + bullets('Assumptions', g.assumptions) + bullets('Not covered', g.out_of_scope) + bullets('Open questions', g.open_questions) + bullets('Notes', g.notes)
      + '<h3>How to read this map</h3><ul><li>Each box is a part of the system; each arrow shows information or control moving from one part to another.</li>'
      + '<li>Click a box or arrow for a plain-English explanation. Boxes with a <b>+</b> badge open more detail: click, then <b>See inside</b>.</li>'
      + '<li>Switch to <b>Technical</b> for file and function names.</li>'
      + '<li>Boxes with a dashed border were <b>inferred</b>, not directly confirmed in the code. Views marked <b>Draft</b> were drawn automatically.</li>'
      + '<li><b>🔥 Hotspots</b> colours code that is complex and changes often: the riskiest places to change.</li>'
      + '<li>Use <b>▶ Walk me through</b> to step through a view in order (arrow keys or space to advance).</li></ul>'
      + `<p style="color:var(--ink-3);font-size:12.5px;margin-top:14px">${(d._build || {}).mode === 'cdn'
          ? 'This file downloads only the Pele drawing library (version ' + esc(d._build.pele) + ', integrity-checked) from cdn.jsdelivr.net. Map content stays in the file and is never sent anywhere.'
          : 'This file works fully offline and makes no network requests.'} Diagrams drawn with Pele${d._build?.pele ? ' ' + esc(d._build.pele) : ''} (MIT licence). Built with codeflow-map ${esc(G.version || '')}.</p>`;
    $('about').showModal();
  }
  function setupMenu(){
    const menu = $('menu');
    $('menuBtn').onclick = e => { e.stopPropagation(); menu.classList.toggle('open'); $('menuBtn').setAttribute('aria-expanded', menu.classList.contains('open')); };
    document.addEventListener('click', () => { menu.classList.remove('open'); $('menuBtn').setAttribute('aria-expanded', 'false'); });
    $('aboutClose').onclick = () => $('about').close();
    menu.querySelector('.menu-list').addEventListener('click', e => {
      const act = e.target.closest('[data-act]')?.dataset.act; menu.classList.remove('open');
      const v = S.view; const name = slug(S.data.title) + '-' + slug(v?.id);
      try {
        if (act === 'about') about();
        if (act === 'fullscreen') (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
        if (act === 'print') window.print();
        if (act === 'svg') download(name + '.svg', exportSvg(v), 'image/svg+xml');
        if (act === 'mmd') download(name + '.mmd', portable(v), 'text/plain');
        if (act === 'md') download(slug(S.data.title) + '-flow-map.md', allMarkdown(), 'text/markdown');
        if (act === 'copy') copyText('```mermaid\n' + portable(v) + '\n```', 'Mermaid code copied');
        if (act === 'link') copyText(location.href.split('#')[0] + '#view=' + encodeURIComponent(v.id), 'Link copied (works for anyone with this file)');
      } catch (err) { toast('Could not export: ' + (err.message || err)); }
    });
    window.addEventListener('beforeprint', () => { const pa = $('printArea'); pa.innerHTML = ''; if (!S.view) return;
      const p = document.createElement('p'); p.style.cssText = 'font-size:12px;color:#555'; p.textContent = S.view.summary || ''; pa.appendChild(p);
      try { pa.insertAdjacentHTML('beforeend', pele.render(portable(S.view), Object.assign({}, PELE_OPTS, { idPrefix: 'print' })).svg); } catch (e) {} });
  }
  function setupToggles(){
    const setMode = m => { S.mode = m; $('modeSimple').setAttribute('aria-pressed', m === 'simple'); $('modeTech').setAttribute('aria-pressed', m === 'technical'); render(S.view.id, { keepWalk: true }); };
    $('modeSimple').onclick = () => S.mode !== 'simple' && setMode('simple');
    $('modeTech').onclick = () => S.mode !== 'technical' && setMode('technical');
    $('sensBtn').onclick = () => { S.sens = !S.sens; $('sensBtn').setAttribute('aria-pressed', S.sens); render(S.view.id, { keepWalk: true }); };
    $('heatBtn').onclick = () => { S.heat = !S.heat; $('heatBtn').setAttribute('aria-pressed', S.heat); S.svg?.classList.toggle('heat-on', S.heat); };
    $('themeBtn').onclick = () => setTheme({ auto: 'light', light: 'dark', dark: 'auto' }[S.theme || 'auto']);
    // a plain mouse wheel zooms too (Pele zooms on Ctrl/⌘ + wheel and pinch)
    $('diagram').addEventListener('wheel', e => {
      if (!e.isTrusted || e.ctrlKey || e.metaKey || !S.svg || e.target.closest('.error')) return;
      e.preventDefault(); e.stopPropagation();
      const dy = e.deltaMode ? e.deltaY * 16 : e.deltaY;
      S.svg.dispatchEvent(new WheelEvent('wheel', { clientX: e.clientX, clientY: e.clientY, deltaY: Math.max(-24, Math.min(24, dy * 0.5)), ctrlKey: true, bubbles: true, cancelable: true }));
      hideHint();
    }, { capture: true, passive: false });
    $('diagram').addEventListener('pointerdown', hideHint, { passive: true });
    document.addEventListener('keydown', e => {
      if (e.target.matches('input,textarea,select')) return;
      if (e.key === '/') { e.preventDefault(); $('search').focus(); }
      else if (e.key === 'Escape') { if (S.walk) { stopWalk(); fitView(); } else { closePanel(); clearFocus(); } }
      else if (S.walk && (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown')) { e.preventDefault(); $('capNext').click(); }
      else if (S.walk && (e.key === 'ArrowLeft' || e.key === 'PageUp')) { e.preventDefault(); $('capPrev').click(); }
    });
  }
  let hintHidden = false; function hideHint(){ if (hintHidden) return; hintHidden = true; $('hint').style.opacity = 0; }

  // ------------------------------------------------------------------ start
  function fail(msg){ document.body.innerHTML = `<div class="error"><h3>Code Flow Map could not start</h3><p>${esc(msg)}</p></div>`; }
  function start(){
    const d = window.FLOWMAP; if (!d || !Array.isArray(d.views) || !d.views.length) return fail('No map data found in this file.');
    S.data = d;
    d.views.forEach(v => { v.type ||= 'flowchart'; S.views[v.id] = v; S.order.push(v.id); });
    (d.modules || []).forEach(m => S.modules[m.id] = m);
    S.mode = d.default_mode === 'technical' ? 'technical' : 'simple';
    $('modeSimple').setAttribute('aria-pressed', S.mode === 'simple'); $('modeTech').setAttribute('aria-pressed', S.mode === 'technical');
    document.title = (d.title || 'Code Flow Map') + ' — flow map';
    $('title').textContent = d.title || 'Code Flow Map';
    const g = d.generated || {};
    $('subtitle').textContent = [d.subtitle, g.date && 'Prepared ' + g.date, g.commit && 'version ' + String(g.commit).slice(0, 10)].filter(Boolean).join(' · ');
    kindCss();
    setTheme(store.get('theme') || (d.theme && d.theme.mode) || 'auto');
    setupPanel(); setupNav(); setupWalk(); setupSearch(); setupMenu(); setupToggles();
    const fromLink = fromHash();
    if (fromLink) navigateTo(fromLink);
    else openView(d.start_view && S.views[d.start_view] ? d.start_view : topViews()[0] || S.order[0]);
    setTimeout(hideHint, 7000);
  }
  return { start, fail, _state: S, _camera: camera };
})();
</script>
